name: CI

# The test suite, ruff, tsc and vitest already exist and are green locally.
# This just makes them run on every push and PR instead of when someone remembers.
# For financial software, "the tests will catch you" only holds if something runs them.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the in-flight run irrelevant. Cancel it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # 3.12 is the floor the project commits to: requires-python = ">=3.12" and
      # ruff target-version = "py312". Testing exactly that validates the promise.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  frontend:
    name: Frontend — tsc + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Matches the verified dev environment (Node 24, per contributing.md).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build last: it runs tsc -b + vite build, so a green typecheck above gives a
      # cleaner first failure than a bundling error would.
      - name: Build
        run: npm run build
